# paperpress project file. One [[titles]] block per periodical.

[project]
name = "The Crisis Archive"

# [[titles]]
# slug = "womans-journal"              # folder name under titles/
# name = "The Woman's Journal"
# kind = "newspaper"                   # newspaper | magazine
# ia_query = "collection:pub_the-womans-journal"   # optional default for `paperpress add ia`

# OCR engine (newspaper-ocr). GLM-OCR via a local MLX server on :8080:
#   mlx_vlm.server --host 127.0.0.1 --port 8080 --model mlx-community/GLM-OCR-bf16
# [ocr]
# detector = "doclayout_yolo"
# recognizer = "tesseract"
# recognizer_model = "news_combo_fast"

# Optional LLM table of contents (`paperpress enrich`); needs OPENROUTER_API_KEY:
# [enrich]
# model = "openai/gpt-5.6-luna"            # per-page article extraction
# stitch_model = "google/gemini-3.8-flash" # links stories continued across pages

# Optional LLM translation (`paperpress translate`); needs OPENROUTER_API_KEY:
# [translate]
# model = "google/gemini-3.8-flash"
# target = "English"                       # the language to translate into
# source = "French"                        # the original's language (optional)

[[titles]]
slug = "crisis"
name = "The Crisis"
kind = "magazine"

[ocr]
detector = "doclayout_yolo"
recognizer = "glm-ocr"
